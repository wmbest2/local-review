<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>local-review</title>
<link rel="stylesheet" href="/vendor/hljs-theme.css">
<script src="/vendor/highlight.min.js"></script>
<script src="/vendor/hljs-groovy.min.js"></script>
<script src="/vendor/hljs-gradle.min.js"></script>
<script src="/vendor/hljs-properties.min.js"></script>
<script src="/vendor/hljs-protobuf.min.js"></script>
<script src="/vendor/hljs-dart.min.js"></script>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --fg-soft: #3d444d; --muted: #6e7781; --faint: #8c959f;
    --border: #d8dee4; --divider: #eaeef2; --panel: #f6f8fa;
    --add-bg: #e6ffec; --add-num: #d1f8d9; --add-sign: #1a7f37;
    --del-bg: #ffebe9; --del-num: #ffdcd7; --del-sign: #cf222e;
    --hunk-bg: #f0f6ff; --hunk-fg: #57606a;
    --accent: #0969da; --primary: #1f883d; --warn: #9a6700; --warn-bg: #fff8c5; --danger: #cf222e; --draft: #8250df;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    --mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #d1d7e0; --fg-soft: #b7bdc8; --muted: #8b949e; --faint: #6e7681;
      --border: #30363d; --divider: #21262d; --panel: #151b23;
      --add-bg: rgba(46, 160, 67, .12); --add-num: rgba(46, 160, 67, .22); --add-sign: #3fb950;
      --del-bg: rgba(248, 81, 73, .10); --del-num: rgba(248, 81, 73, .20); --del-sign: #f85149;
      --hunk-bg: rgba(56, 139, 253, .08); --hunk-fg: #8b949e;
      --accent: #4493f8; --primary: #238636; --warn: #d29922; --warn-bg: #272115; --danger: #f85149; --draft: #ab7df8;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.6 var(--sans); background: var(--bg); color: var(--fg);
         -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  /* One line, always: the sidebar and file headers stick at top: 52px, so a wrapped second row would
     spill over them. Long items (title, stack branch) shrink and ellipsize instead. */
  header { position: sticky; top: 0; z-index: 10; display: flex; gap: 14px; align-items: center; flex-wrap: nowrap;
           height: 52px; padding: 0 20px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 15px; font-weight: 600; margin: 0 8px 0 0; letter-spacing: -.01em;
              min-width: 0; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  [hidden] { display: none !important; }
  header > * { flex-shrink: 0; }
  header > h1, header > #stack-wrap, header > #counts { flex-shrink: 1; }
  header > #counts { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Narrower windows drop the per-kind totals line so the controls and Submit still fit. */
  @media (max-width: 1600px) { #totals .split { display: none; } }
  #stack-wrap { min-width: 0; }
  #stack-branch { min-width: 140px; max-width: 420px; width: 100%; text-overflow: ellipsis; }
  header .spacer { flex: 1; }
  header label { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; }
  select, input[type=text], textarea, button { font: inherit; color: var(--fg); background: var(--bg);
           border: 1px solid var(--border); border-radius: 6px; }
  select, input[type=text] { padding: 3px 8px; font-size: 13px; }
  input[type=text]:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  button { padding: 4px 12px; cursor: pointer; background: var(--panel); font-size: 13px; font-weight: 500; }
  button:hover { border-color: var(--faint); }
  button.primary { background: var(--primary); color: #fff; border-color: transparent; }
  button.primary:hover { filter: brightness(1.08); }
  button.link { border: none; background: none; color: var(--accent); padding: 0 4px; }
  button.link:hover { text-decoration: underline; }
  button:disabled { opacity: .5; cursor: default; }
  textarea { width: 100%; min-height: 80px; padding: 10px 12px; resize: vertical; line-height: 1.55; font-size: 14px; }
  #banner { display: none; padding: 8px 20px; background: var(--warn-bg); color: var(--fg); font-size: 13px;
            border-bottom: 1px solid var(--border); }
  #banner.show { display: flex; gap: 12px; align-items: center; }
  #layout { display: flex; align-items: flex-start; }
  aside { position: sticky; top: 52px; width: var(--files-w, 300px); flex-shrink: 0; max-height: calc(100vh - 52px); overflow: auto;
          padding: 16px 8px 16px 16px; font-size: 13px; }
  aside a { display: flex; gap: 8px; padding: 3px 8px; border-radius: 6px; color: var(--fg-soft); text-decoration: none;
            align-items: center; line-height: 1.5; }
  aside a:hover { background: var(--panel); color: var(--fg); }
  aside a.viewed { color: var(--faint); }
  aside .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  aside .dir { display: flex; gap: 6px; align-items: center; padding: 3px 8px; border-radius: 6px; cursor: pointer;
               color: var(--muted); line-height: 1.5; user-select: none; }
  aside .dir:hover { background: var(--panel); color: var(--fg); }
  aside .dir .caret { width: 12px; font-size: 13px; line-height: 1; color: var(--muted); transition: transform .1s; }
  aside .dir.closed .caret { transform: rotate(-90deg); }
  /* A merged folder is truncated from the start, keeping the deepest (most telling) folder visible. */
  aside .dir .name { font-weight: 500; direction: rtl; text-align: left; }
  aside .dir.closed + .kids { display: none; }
  aside .dir.viewed { color: var(--faint); }
  aside .tools { display: flex; gap: 2px; align-items: center; padding: 0 0 8px 8px; color: var(--faint); font-size: 12px; }
  aside .tools .spacer { flex: 1; }
  aside .tools button { font-size: 12px; color: var(--muted); }
  aside a.current, aside .dir.current { background: var(--panel); color: var(--fg); box-shadow: inset 2px 0 0 var(--accent); }
  body.no-files aside, body.no-files #files-resizer { display: none; }
  /* Drag to resize the file list; double-click to reset. The width is remembered across repos. */
  #files-resizer { position: sticky; top: 52px; flex-shrink: 0; width: 7px; margin: 0 -3px; height: calc(100vh - 52px);
                   cursor: col-resize; z-index: 1; }
  #files-resizer::after { content: ''; position: absolute; left: 3px; top: 0; bottom: 0; width: 1px; background: transparent; }
  #files-resizer:hover::after, body.resizing #files-resizer::after { background: var(--accent); }
  body.resizing { cursor: col-resize; user-select: none; }
  body.no-files main { padding-left: 20px; }
  #toggle-files { padding: 2px 8px; font-size: 15px; line-height: 1.2; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; padding: 1px 8px; font-size: 12px; background: var(--bg); color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--panel); color: var(--fg); font-weight: 600; }
  aside .kind-filter { padding: 0 0 8px 8px; }
  aside .group { display: flex; gap: 6px; align-items: baseline; padding: 10px 8px 2px; font-size: 11px; font-weight: 600;
                 letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  aside .group:first-of-type { padding-top: 0; }
  .group .adds, .group .dels { font-size: 11px; text-transform: none; letter-spacing: 0; }
  .group-head { display: flex; gap: 8px; align-items: baseline; margin: 28px 0 10px; font-size: 13px; font-weight: 600;
                color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .group-head:first-child { margin-top: 0; }
  .group-head .n { font-weight: 400; text-transform: none; letter-spacing: 0; }
  .tag { font-size: 10.5px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; border-radius: 4px; padding: 0 5px;
         line-height: 16px; color: var(--draft); border: 1px solid var(--draft); }
  .filtered { display: none !important; }
  aside .cnt { font-size: 11px; background: var(--accent); color: #fff; border-radius: 10px; padding: 0 7px; line-height: 18px; }
  .st { font-family: var(--mono); font-size: 11px; width: 12px; font-weight: 600; color: var(--warn); }
  .st.added { color: var(--add-sign); } .st.deleted { color: var(--del-sign); } .st.modified { color: var(--muted); }
  main { flex: 1; min-width: 0; padding: 16px 20px 96px 8px; }
  .meta { color: var(--muted); margin-bottom: 16px; font-size: 13px; }
  .meta details { display: inline; }
  .panel { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; }
  .panel > h2 { margin: 0; padding: 10px 16px; font-size: 13px; font-weight: 600; background: var(--panel);
                border-bottom: 1px solid var(--border); border-radius: 8px 8px 0 0; }
  .panel > .inner { padding: 12px 16px; }
  /* Anchor jumps land below the sticky header instead of under it. */
  .file { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; overflow: clip; scroll-margin-top: 64px; }
  .fhead { position: sticky; top: 52px; z-index: 5; display: flex; gap: 12px; align-items: center; padding: 8px 12px;
           background: var(--panel); border-bottom: 1px solid var(--border); }
  .fhead .path { font-family: var(--mono); font-size: 12.5px; flex: 1; overflow-wrap: anywhere; font-weight: 500; }
  .fhead .toggle { width: 24px; padding: 0; border: none; background: none; color: var(--muted); }
  #totals { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; font-size: 12px;
            line-height: 1.35; color: var(--muted); white-space: nowrap; }
  #totals .total { display: flex; gap: 6px; align-items: baseline; }
  /* The breakdown is secondary: smaller and uncoloured, so the total stays the thing you read. */
  #totals .split { font-size: 11px; color: var(--faint); font-family: var(--mono); }
  .adds, .dels { font-family: var(--mono); font-size: 12px; font-weight: 600; }
  .adds { color: var(--add-sign); } .dels { color: var(--del-sign); }
  .file.collapsed .fbody { display: none; }
  .file.collapsed .fhead { border-bottom: none; }
  .note { padding: 16px; color: var(--muted); font-size: 13px; }
  table.diff { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 13px; table-layout: fixed; }
  table.diff col.num { width: 56px; }
  td.num { color: var(--faint); text-align: right; padding: 0 10px; user-select: none; vertical-align: top;
           font-size: 12px; line-height: 22px; }
  td.code { white-space: pre-wrap; overflow-wrap: anywhere; padding: 0 16px 0 26px; position: relative;
            line-height: 22px; tab-size: 4; color: var(--fg); }
  tr.add td.code { background: var(--add-bg); } tr.add td.num { background: var(--add-num); }
  /* Side by side: each cell carries its own side's add/del colour; a side with no line is blank. */
  table.sbs td.code.add { background: var(--add-bg); } table.sbs td.num.add { background: var(--add-num); }
  table.sbs td.code.del { background: var(--del-bg); } table.sbs td.num.del { background: var(--del-num); }
  table.sbs td.code.add .sign { color: var(--add-sign); } table.sbs td.code.del .sign { color: var(--del-sign); }
  table.sbs td.blank { background: var(--panel); }
  table.sbs td.num.new { border-left: 1px solid var(--divider); }
  tr.del td.code { background: var(--del-bg); } tr.del td.num { background: var(--del-num); }
  tr.hunk td { background: var(--hunk-bg); color: var(--hunk-fg); padding: 4px 12px; line-height: 20px; font-size: 12px; }
  .sign { position: absolute; left: 10px; color: var(--faint); user-select: none; }
  tr.add .sign { color: var(--add-sign); } tr.del .sign { color: var(--del-sign); }
  .addc { position: absolute; left: -11px; top: 2px; width: 20px; height: 18px; padding: 0; line-height: 16px;
          border-radius: 4px; background: var(--accent); color: #fff; border: none; font-weight: 700; font-size: 13px;
          display: none; z-index: 2; }
  tr.ln:hover .addc { display: block; }
  tr.ln:hover td.code { box-shadow: inset 2px 0 0 var(--accent); }
  /* Lines in a range being commented on (dragging, an open form, or a hovered range thread). The
     overlay is an image so it tints the add/del colour underneath instead of replacing it. */
  tr.ln.sel td { background-image: linear-gradient(rgba(84, 174, 255, .18), rgba(84, 174, 255, .18)); }
  tr.ln.sel td.code { box-shadow: inset 3px 0 0 var(--accent); }
  body.dragging, body.dragging * { cursor: ns-resize !important; user-select: none; }
  tr.thread-row > td { padding: 10px 16px; background: var(--panel); border-top: 1px solid var(--divider);
                       border-bottom: 1px solid var(--divider); font-family: var(--sans); font-size: 14px; }
  .thread { border: 1px solid var(--border); border-radius: 8px; margin: 4px 0 10px; max-width: 860px; background: var(--bg); }
  .thread.st-draft { border-color: var(--draft); }
  .thead { display: flex; gap: 8px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--divider);
           font-size: 12px; }
  .thread.folded .thead { border-bottom: none; }
  .thread.folded .tbody { display: none; }
  .thead .loc { font-family: var(--mono); flex: 1; color: var(--muted); overflow: hidden; text-overflow: ellipsis;
                white-space: nowrap; }
  .thead .id { font-family: var(--mono); color: var(--faint); font-size: 11px; }
  .badge { font-size: 11px; border-radius: 10px; padding: 0 8px; line-height: 18px; border: 1px solid var(--border);
           font-weight: 500; white-space: nowrap; color: var(--muted); }
  .badge.draft { color: var(--draft); border-color: var(--draft); }
  .badge.open { color: var(--accent); border-color: var(--accent); }
  .badge.replied, .badge.outdated { color: var(--warn); border-color: var(--warn); }
  .badge.addressed { color: var(--add-sign); border-color: var(--add-sign); }
  .msg { padding: 10px 14px; border-bottom: 1px solid var(--divider); }
  .msg:last-child { border-bottom: none; }
  .msg .who { font-weight: 600; font-size: 13px; } .msg .when { color: var(--faint); font-size: 12px; margin-left: 8px; }
  .msg.agent .who { color: var(--draft); }
  .msg .body { margin-top: 4px; overflow-wrap: anywhere; max-width: 75ch; line-height: 1.6; color: var(--fg-soft); }
  .msg .body pre, pre.ctx { background: var(--panel); padding: 10px 12px; border-radius: 6px; overflow: auto;
                            border: 1px solid var(--divider); font-family: var(--mono); font-size: 12.5px;
                            line-height: 1.55; margin: 6px 0; white-space: pre; max-width: none; }
  .msg .body code { background: var(--panel); padding: .1em .35em; border-radius: 4px; font-family: var(--mono);
                    font-size: 85%; border: 1px solid var(--divider); }
  .reply { padding: 10px 14px; border-top: 1px solid var(--divider); }
  .reply textarea { min-height: 38px; }
  .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .cform { max-width: 860px; margin: 4px 0 10px; }
  .hint { color: var(--muted); font-size: 12px; margin-right: auto; align-self: center; }
  dialog { border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--fg);
           width: 560px; padding: 20px; }
  dialog h3 { font-size: 16px; font-weight: 600; }
  dialog::backdrop { background: rgba(0, 0, 0, .4); }
  #loading { padding: 48px; color: var(--muted); text-align: center; }
  .err { color: var(--danger); white-space: pre-wrap; font-size: 13px; }
</style>
</head>
<body>
<header>
  <button id="toggle-files" title="Show or hide the file tree (f)">☰</button>
  <h1 id="title">local-review</h1>
  <label>View
    <select id="mode">
      <option value="branch">Branch vs base</option>
      <option value="working">Uncommitted changes</option>
      <option value="since">Since last review</option>
      <option value="stack" hidden>Stack</option>
    </select>
  </label>
  <label id="base-wrap">Base <input id="base" type="text" size="16"></label>
  <label id="stack-wrap" hidden>Branch <select id="stack-branch"></select></label>
  <label>Context
    <select id="context">
      <option value="3">3 lines</option>
      <option value="10">10 lines</option>
      <option value="100000">Full file</option>
    </select>
  </label>
  <label class="hint" title="Hide changes that only add or remove whitespace (git diff -w)"><input type="checkbox" id="ws"> Hide whitespace</label>
  <label class="hint" title="Old and new side by side instead of one column (s)"><input type="checkbox" id="sbs"> Side by side</label>
  <button id="refresh" title="Re-read the working tree (r)">Refresh</button>
  <span class="spacer"></span>
  <span id="totals" title="Total lines changed in this view"></span>
  <span id="counts" class="hint"></span>
  <button id="submit" class="primary">Submit review</button>
</header>
<div id="banner"><span id="banner-text"></span><button id="banner-reload">Reload diff</button><button id="banner-close" class="link">Dismiss</button></div>
<div id="layout">
  <aside id="files"></aside>
  <div id="files-resizer" title="Drag to resize · double-click to reset"></div>
  <main>
    <div id="loading">Loading…</div>
    <div id="content" hidden>
      <div class="meta" id="viewmeta"></div>
      <div class="panel" id="general">
        <h2>Review conversation</h2>
        <div class="inner">
          <div id="general-threads"></div>
          <button id="add-general" class="link">+ Add a general comment</button>
        </div>
      </div>
      <div class="panel" id="other" hidden>
        <h2>Comments not shown in this diff</h2>
        <div class="inner" id="other-threads"></div>
      </div>
      <div id="diff"></div>
    </div>
  </main>
</div>
<dialog id="submit-dlg">
  <h3 style="margin-top:0">Submit review</h3>
  <p class="hint" id="submit-info"></p>
  <textarea id="summary" placeholder="Optional overall summary for the agent…"></textarea>
  <div class="btns">
    <span class="err" id="submit-err"></span>
    <button id="submit-cancel">Cancel</button>
    <button id="submit-go" class="primary">Submit review</button>
  </div>
</dialog>
<script>
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

async function api(path, body) {
  const opts = body === undefined ? {} : {
    method: 'POST', headers: {'Content-Type': 'application/json', 'X-Local-Review': '1'}, body: JSON.stringify(body)};
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

// Tiny markdown: fenced code, inline code, bold. Everything is escaped first.
function md(text) {
  const parts = String(text).split(/```[^\n]*\n?/);
  return parts.map((p, i) => {
    if (i % 2 === 1) return `<pre>${esc(p.replace(/\n$/, ''))}</pre>`;
    return esc(p).replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
      .replace(/\n/g, '<br>');
  }).join('');
}

function when(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString(undefined, {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'});
}

let meta, view, comments = [], reviews = [], version = null, pendingRender = false;
const unfolded = new Set();
const key = k => `lr:${meta.root}:${k}`;
const pref = (k, d) => localStorage.getItem(key(k)) ?? d;
const setPref = (k, v) => localStorage.setItem(key(k), v);

// File list width: global (not per repo), so it carries over between reviews.
const FILES_W_KEY = 'lr:files-width';
function setFilesWidth(px) {
  if (px == null) { document.documentElement.style.removeProperty('--files-w'); return; }
  const w = Math.round(Math.min(Math.max(px, 180), window.innerWidth * 0.6));
  document.documentElement.style.setProperty('--files-w', `${w}px`);
  return w;
}
setFilesWidth(+localStorage.getItem(FILES_W_KEY) || null);
{
  const handle = document.getElementById('files-resizer');
  handle.addEventListener('pointerdown', e => {
    e.preventDefault();
    handle.setPointerCapture(e.pointerId);
    document.body.classList.add('resizing');
    const left = document.getElementById('files').getBoundingClientRect().left;
    const move = ev => setFilesWidth(ev.clientX - left);
    const up = ev => {
      handle.removeEventListener('pointermove', move);
      handle.removeEventListener('pointerup', up);
      document.body.classList.remove('resizing');
      localStorage.setItem(FILES_W_KEY, setFilesWidth(ev.clientX - left));
    };
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', up);
  });
  handle.addEventListener('dblclick', () => { localStorage.removeItem(FILES_W_KEY); setFilesWidth(null); });
}

async function init() {
  meta = await api('/api/meta');
  document.title = `review · ${meta.name}`;
  $('#title').textContent = `${meta.name} · ${meta.branch}`;
  if (meta.stack) {
    $('#mode option[value=stack]').hidden = false;
    // "N. title", with ● on the checked-out branch: its view includes uncommitted edits.
    $('#stack-branch').innerHTML = meta.stack.map((p, i) =>
      `<option value="${esc(p.branch)}" title="${esc(p.branch)}">${p.branch === meta.branch ? '● ' : ''}${i + 1}. ${esc(p.title || p.branch)}</option>`).join('');
    const onStack = meta.stack.some(p => p.branch === meta.branch);
    const saved = pref('stackBranch', '');
    $('#stack-branch').value = meta.stack.some(p => p.branch === saved) ? saved : (onStack ? meta.branch : meta.stack[0].branch);
    $('#stack-branch').onchange = () => { setPref('stackBranch', $('#stack-branch').value); loadDiff(); };
    $('#stack-branch').title = 'Branch under review (● = checked out, includes uncommitted edits)';
  }
  $('#mode').value = pref('mode', meta.mode);
  if (!meta.stack && $('#mode').value === 'stack') $('#mode').value = 'branch';
  $('#base').value = pref('base', meta.base);
  $('#context').value = pref('context', '3');
  $('#ws').checked = pref('ws', '0') === '1';
  $('#ws').onchange = () => { setPref('ws', $('#ws').checked ? '1' : '0'); wsOverride.clear(); loadDiff(); };
  $('#sbs').checked = sideBySide();
  $('#sbs').onchange = () => setSideBySide($('#sbs').checked);
  $('#mode').onchange = () => { setPref('mode', $('#mode').value); loadDiff(); };
  $('#base').onchange = () => { setPref('base', $('#base').value.trim()); loadDiff(); };
  $('#context').onchange = () => { setPref('context', $('#context').value); loadDiff(); };
  $('#refresh').onclick = () => loadDiff();
  $('#banner-reload').onclick = () => { hideBanner(); loadDiff(); };
  $('#banner-close').onclick = hideBanner;
  $('#submit').onclick = openSubmit;
  $('#submit-cancel').onclick = () => $('#submit-dlg').close();
  $('#submit-go').onclick = doSubmit;
  $('#add-general').onclick = () => openForm($('#general-threads'), {file: null});
  document.addEventListener('click', onClick);
  document.addEventListener('mousedown', onLineMouseDown);
  document.addEventListener('mouseover', onLineMouseOver);
  document.addEventListener('mouseup', onLineMouseUp);
  document.addEventListener('mouseover', onThreadHover);
  document.body.classList.toggle('no-files', pref('files', '1') === '0');
  $('#toggle-files').onclick = toggleFiles;
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { ticking = false; markCurrentFile(); });
  }, {passive: true});
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.tagName === 'TEXTAREA') {
      const btn = e.target.parentElement.querySelector('button.primary');
      if (btn) { e.preventDefault(); btn.click(); }
    } else if (!['TEXTAREA', 'INPUT', 'SELECT'].includes(e.target.tagName) && !e.metaKey && !e.ctrlKey && !e.altKey) {
      if (e.key === 'r') loadDiff();
      else if (e.key === 'f') toggleFiles();
      else if (e.key === 's') setSideBySide(!sideBySide());
    }
  });
  await loadComments();
  await loadDiff();
  setInterval(poll, 3000);
}

async function loadDiff() {
  const mode = $('#mode').value;
  $('#base-wrap').style.display = mode === 'branch' ? '' : 'none';
  $('#stack-wrap').hidden = mode !== 'stack';
  $('#mode option[value=since]').disabled = !reviews.length;
  const q = diffParams($('#ws').checked);
  const shown = mode === 'stack' ? $('#stack-branch').value : meta.branch;
  $('#title').textContent = `${meta.name} · ${shown}`;
  $('#title').title = `${meta.name} · ${shown}`;
  $('#loading').hidden = false;
  $('#loading').textContent = 'Loading…';
  try {
    view = await api(`/api/diff?${q}`);
    view.files = KIND_ORDER.flatMap(k => view.files.filter(f => kindOf(f) === k));
  } catch (e) {
    $('#loading').innerHTML = `<span class="err">${esc(e.message)}</span>`;
    $('#content').hidden = true;
    return;
  }
  $('#loading').hidden = true;
  $('#content').hidden = false;
  renderDiff();
  renderComments();
  // Re-apply per-file whitespace overrides that differ from the header setting.
  for (const [i, f] of view.files.entries()) {
    if (wsOverride.has(f.path) && wsOverride.get(f.path) !== $('#ws').checked) await refetchFile(i);
  }
}

function diffParams(ignoreWs) {
  const mode = $('#mode').value;
  const q = new URLSearchParams({mode, base: $('#base').value.trim(), context: $('#context').value, ws: ignoreWs ? '1' : '0'});
  if (mode === 'stack') q.set('branch', $('#stack-branch').value);
  return q;
}

// Per-file "hide whitespace", overriding the header checkbox for that file only. Keyed by path.
const wsOverride = new Map();
const ignoresWs = f => wsOverride.has(f.path) ? wsOverride.get(f.path) : $('#ws').checked;

// Re-diffs one file with its whitespace setting and swaps it into the view in place.
async function refetchFile(i) {
  const f = view.files[i];
  const ignore = ignoresWs(f);
  const q = diffParams(ignore);
  q.set('path', f.new_path || f.path);
  if (f.old_path && f.old_path !== f.new_path) q.set('old_path', f.old_path);
  // Diff against the trees this view was built from: no fresh working-tree snapshot, which is slow
  // in a big repo, and the file stays consistent with everything else on the page.
  q.set('old_rev', view.old_rev);
  q.set('new_tree', view.new_tree);
  const btn = $(`#f${i} [data-act=toggle-ws]`);
  if (btn) { btn.disabled = true; btn.textContent = 'Loading…'; }
  const res = await api(`/api/diff?${q}`);
  // With -w a file whose every change is whitespace drops out of the diff entirely.
  const next = res.files[0] || {...f, hunks: [], additions: 0, deletions: 0};
  view.files[i] = {...next, hash: f.hash, wsOnly: !res.files.length && ignore};
  const section = $(`#f${i}`);
  const wasCollapsed = section.classList.contains('collapsed');
  section.outerHTML = fileHtml(view.files[i], i);
  if (wasCollapsed) $(`#f${i}`).classList.add('collapsed');
  else if (view.files[i].additions + view.files[i].deletions <= LARGE) fillBody(i);
  renderTotals();
  renderComments();
}

async function loadComments(fromPoll = false) {
  const j = await api('/api/comments');
  const changed = version !== null && j.v !== version;
  version = j.v;
  comments = j.comments;
  reviews = j.reviews;
  if (!view) return;
  if (fromPoll && changed) showBanner('Review comments changed — the agent may have updated the code.');
  if (typingInThread()) { pendingRender = true; return; }
  renderComments();
}

async function poll() {
  try {
    const {v} = await api('/api/version');
    if (v !== version) await loadComments(true);
    else if (pendingRender && !typingInThread()) { pendingRender = false; renderComments(); }
  } catch (e) { /* server stopped; keep the page as-is */ }
}

function typingInThread() {
  return $$('.thread textarea').some(t => t.value.trim() || t === document.activeElement);
}

function showBanner(text) { $('#banner-text').textContent = text; $('#banner').classList.add('show'); }
function hideBanner() { $('#banner').classList.remove('show'); }

// ------------------------------------------------------------------------------------------ diff

const LARGE = 1500;
const LANG_ALIASES = {toml: 'ini', cfg: 'ini', conf: 'ini', pro: 'properties', mdx: 'markdown'};

function langFor(path) {
  if (typeof hljs === 'undefined' || !path) return null;
  const name = path.split('/').pop().toLowerCase();
  if (name === 'dockerfile' || name === 'makefile') return hljs.getLanguage(name) ? name : null;
  const ext = name.includes('.') ? name.split('.').pop() : '';
  const lang = LANG_ALIASES[ext] || ext;
  return lang && hljs.getLanguage(lang) ? lang : null;
}

// Highlights a block of lines together (so multi-line strings/comments are tokenized correctly) and
// splits the result back into per-line HTML, closing and reopening spans that cross line breaks.
function highlightLines(lines, lang) {
  if (!lang || !lines.length) return lines.map(esc);
  let html;
  try { html = hljs.highlight(lines.join('\n'), {language: lang, ignoreIllegals: true}).value; }
  catch (e) { return lines.map(esc); }
  const out = [], open = [];
  let cur = '';
  const re = /(<span[^>]*>)|(<\/span>)|([^<]+)/g;
  let m;
  while ((m = re.exec(html))) {
    if (m[1]) { open.push(m[1]); cur += m[1]; }
    else if (m[2]) { open.pop(); cur += m[2]; }
    else m[3].split('\n').forEach((part, i) => {
      if (i > 0) { out.push(cur + '</span>'.repeat(open.length)); cur = open.join(''); }
      cur += part;
    });
  }
  out.push(cur);
  return out.length === lines.length ? out : lines.map(esc);
}

function renderDiff() {
  const files = view.files;
  const c = view.commits.length;
  $('#viewmeta').innerHTML = `${esc(view.label)} · ${files.length} file${files.length === 1 ? '' : 's'}` +
    (view.mode === 'branch' ? ` · <details><summary style="display:inline;cursor:pointer">${c} commit${c === 1 ? '' : 's'}</summary>` +
      `<pre class="ctx">${esc(view.commits.join('\n') || '(no commits; uncommitted changes only)')}</pre></details>` : '');
  const split = isSplit();
  $('#diff').innerHTML = files.length
    ? files.map((f, i) => (split && (i === 0 || kindOf(f) !== kindOf(files[i - 1]))
        ? `<div class="group-head" data-kind="${kindOf(f)}"></div>` : '') + fileHtml(f, i)).join('')
    : '<div class="note">No changes in this view.</div>';
  files.forEach((f, i) => {
    if (isViewed(f)) $(`#f${i}`).classList.add('collapsed');
    else if (f.additions + f.deletions <= LARGE) fillBody(i);
  });
  applyKindFilter();
}

// ------------------------------------------------------------------------- code, tests, resources, project

// The server guesses each file's kind from its path (see kind_classifier); this splits the page, the
// totals and the tree by kind, and filters to one.
const KIND_ORDER = ['code', 'tests', 'resources', 'project'];
const KIND_LABEL = {code: 'Code', tests: 'Tests', resources: 'Resources', project: 'Project'};
const KIND_TAG = {tests: 'test', resources: 'resource', project: 'project'};
function kindOf(f) { return f.kind || (f.test ? 'tests' : 'code'); }
function kindsPresent() { return KIND_ORDER.filter(k => view.files.some(f => kindOf(f) === k)); }
function isSplit() { return kindsPresent().length > 1; }
// 'all' or a kind; only applies when the view has more than one kind.
function kindFilter() {
  const k = pref('kind', 'all');
  return isSplit() && kindsPresent().includes(k) ? k : 'all';
}
function shownByFilter(f) { const k = kindFilter(); return k === 'all' || k === kindOf(f); }

function sumLines(files) {
  return files.reduce((t, f) => ({adds: t.adds + f.additions, dels: t.dels + f.deletions}), {adds: 0, dels: 0});
}

function linesHtml({adds, dels}) {
  return `<span class="adds">+${adds.toLocaleString()}</span><span class="dels">−${dels.toLocaleString()}</span>`;
}

function filesLabel(n) { return `${n} file${n === 1 ? '' : 's'}`; }

function applyKindFilter() {
  view.files.forEach((f, i) => $(`#f${i}`).classList.toggle('filtered', !shownByFilter(f)));
  const k = kindFilter();
  for (const head of $$('#diff .group-head')) {
    const files = view.files.filter(f => kindOf(f) === head.dataset.kind);
    head.innerHTML = `${KIND_LABEL[head.dataset.kind]}<span class="n">${filesLabel(files.length)}</span>${linesHtml(sumLines(files))}`;
    head.classList.toggle('filtered', k !== 'all');
  }
  renderTotals();
  renderFileList();
}

// Sums the files on the page, so it follows the view, the filter, the whitespace toggles and
// per-file overrides. With more than one kind showing it also breaks that down by kind.
function renderTotals() {
  const files = view.files.filter(shownByFilter);
  if (!files.length) { $('#totals').innerHTML = ''; return; }
  // "+184 −10", leaving out a side that's zero.
  const brief = ({adds, dels}) => [adds && `+${adds.toLocaleString()}`, dels && `−${dels.toLocaleString()}`].filter(Boolean).join(' ') || '0';
  const byKind = KIND_ORDER.map(k => [k, files.filter(f => kindOf(f) === k)]).filter(([, fs]) => fs.length);
  const split = byKind.length > 1
    ? `<span class="split">${byKind.map(([k, fs]) => `${k} ${brief(sumLines(fs))}`).join(' · ')}</span>` : '';
  $('#totals').innerHTML = `<span class="total">${filesLabel(files.length)}${linesHtml(sumLines(files))}</span>${split}`;
}

function fileHtml(f, i) {
  const path = f.status === 'renamed' ? `${esc(f.old_path)} → ${esc(f.new_path)}` : esc(f.path);
  return `<section class="file" id="f${i}" data-i="${i}">
    <div class="fhead">
      <button class="toggle" data-act="toggle-file" title="Collapse">▾</button>
      <span class="st ${f.status}">${f.status[0].toUpperCase()}</span>
      ${KIND_TAG[kindOf(f)] ? `<span class="tag" title="Guessed from the path; override with git config local-review.code / tests / notTests / resources / project">${KIND_TAG[kindOf(f)]}</span>` : ''}
      <span class="path">${path}</span>
      <span class="adds">+${f.additions}</span><span class="dels">−${f.deletions}</span>
      <button class="link" data-act="toggle-ws" title="Only for this file; the header checkbox sets the default">${ignoresWs(f) ? 'Show whitespace' : 'Hide whitespace'}</button>
      <button class="link" data-act="file-comment" ${f.new_path ? '' : 'hidden'}>Comment on file</button>
      <label class="hint"><input type="checkbox" data-act="viewed" ${isViewed(f) ? 'checked' : ''}> Viewed</label>
    </div>
    <div class="fbody">
      <div class="outside"></div>
      <div class="rows">${f.additions + f.deletions > LARGE
        ? `<div class="note">Large diff (${f.additions + f.deletions} lines). <button data-act="load-file">Load diff</button></div>` : ''}</div>
    </div>
  </section>`;
}

function fillBody(i) {
  const f = view.files[i];
  const el = $(`#f${i} .rows`);
  if (el.dataset.filled) return;
  el.dataset.filled = '1';
  if (f.binary) { el.innerHTML = '<div class="note">Binary file</div>'; return; }
  if (!f.hunks.length) {
    const note = f.wsOnly ? 'Only whitespace changes' : f.status === 'renamed' ? 'Renamed without changes' : 'No textual changes';
    el.innerHTML = `<div class="note">${note}</div>`;
    return;
  }
  if (sideBySide()) { fillSideBySide(f, el); return; }
  const rows = [];
  const oldLang = langFor(f.old_path), newLang = langFor(f.new_path);
  for (const h of f.hunks) {
    rows.push(`<tr class="hunk"><td colspan="3">${esc(h.header)}</td></tr>`);
    // Old side (ctx + del) and new side (ctx + add) are each highlighted as a contiguous block.
    const oldHtml = highlightLines(h.lines.filter(l => l.t !== 'add').map(l => l.s), oldLang);
    const newHtml = highlightLines(h.lines.filter(l => l.t !== 'del').map(l => l.s), newLang);
    let oi = 0, ni = 0;
    for (const l of h.lines) {
      const code = l.t === 'del' ? oldHtml[oi++] : l.t === 'add' ? newHtml[ni++] : (oi++, newHtml[ni++]);
      const sign = l.t === 'add' ? '+' : l.t === 'del' ? '-' : ' ';
      const side = l.t === 'del' ? 'old' : 'new';
      const line = l.t === 'del' ? l.o : l.n;
      rows.push(`<tr class="ln ${l.t}" data-side="${side}" data-line="${line}" data-o="${l.o ?? ''}" data-n="${l.n ?? ''}">` +
        `<td class="num">${l.o ?? ''}</td><td class="num">${l.n ?? ''}</td>` +
        `<td class="code"><button class="addc" data-act="line-comment" title="Comment">+</button>` +
        `<span class="sign">${sign}</span>${code}</td></tr>`);
    }
  }
  el.innerHTML = `<table class="diff"><colgroup><col class="num"><col class="num"><col></colgroup><tbody>${rows.join('')}</tbody></table>`;
}

// ------------------------------------------------------------------------- side by side

// Global, like the file list width: a way of reading diffs, not a per-repo setting.
const SBS_KEY = 'lr:side-by-side';
function sideBySide() { return localStorage.getItem(SBS_KEY) === '1'; }

function setSideBySide(on) {
  if (on) localStorage.setItem(SBS_KEY, '1'); else localStorage.removeItem(SBS_KEY);
  $('#sbs').checked = on;
  for (const el of $$('#diff .rows[data-filled]')) {
    delete el.dataset.filled;
    fillBody(+el.closest('.file').dataset.i);
  }
  renderComments();
}

// Old on the left, new on the right. Context lines fill both sides; within a change, deletions and
// additions pair up row by row, and a side with nothing left goes blank. A row keeps the same
// data-o / data-n as in one column, so comment anchoring, ranges and selection work unchanged; the
// side being commented on comes from which half's + button was pressed.
function fillSideBySide(f, el) {
  const rows = [];
  const oldLang = langFor(f.old_path), newLang = langFor(f.new_path);
  const half = (side, l, code) => {
    if (!l) return '<td class="num blank"></td><td class="code blank"></td>';
    const t = l.t === 'ctx' ? '' : l.t, sign = l.t === 'add' ? '+' : l.t === 'del' ? '-' : ' ';
    return `<td class="num ${side} ${t}">${(side === 'old' ? l.o : l.n) ?? ''}</td>` +
      `<td class="code ${t}"><button class="addc" data-act="line-comment" data-side="${side}" title="Comment">+</button>` +
      `<span class="sign">${sign}</span>${code}</td>`;
  };
  const row = (o, n, oCode, nCode) => {
    const kind = o && n && o === n ? 'ctx' : 'change';
    rows.push(`<tr class="ln ${kind}" data-side="${n ? 'new' : 'old'}" data-o="${o?.o ?? ''}" data-n="${n?.n ?? ''}">` +
      half('old', o, oCode) + half('new', n, nCode) + '</tr>');
  };
  for (const h of f.hunks) {
    rows.push(`<tr class="hunk"><td colspan="4">${esc(h.header)}</td></tr>`);
    const oldHtml = highlightLines(h.lines.filter(l => l.t !== 'add').map(l => l.s), oldLang);
    const newHtml = highlightLines(h.lines.filter(l => l.t !== 'del').map(l => l.s), newLang);
    let oi = 0, ni = 0;
    for (let k = 0; k < h.lines.length;) {
      const l = h.lines[k];
      if (l.t !== 'add' && l.t !== 'del') { row(l, l, oldHtml[oi++], newHtml[ni++]); k++; continue; }
      const dels = [], adds = [];
      while (k < h.lines.length && h.lines[k].t === 'del') dels.push(h.lines[k++]);
      while (k < h.lines.length && h.lines[k].t === 'add') adds.push(h.lines[k++]);
      for (let j = 0; j < Math.max(dels.length, adds.length); j++) {
        row(dels[j], adds[j], dels[j] ? oldHtml[oi++] : '', adds[j] ? newHtml[ni++] : '');
      }
    }
  }
  el.innerHTML = '<table class="diff sbs" data-cols="4"><colgroup><col class="num"><col><col class="num"><col></colgroup>' +
    `<tbody>${rows.join('')}</tbody></table>`;
}

function isViewed(f) { return pref(`viewed:${f.path}`, '') === f.hash; }

function renderFileList() {
  const counts = {};
  for (const c of comments) if (c.file && ['draft', 'open', 'replied', 'addressed'].includes(c.status)) counts[c.file] = (counts[c.file] || 0) + 1;
  const entries = view.files.map((f, i) => ({f, i})).filter(e => shownByFilter(e.f));
  // With more than one kind showing, each gets its own tree under a heading.
  const groups = kindFilter() === 'all' && isSplit()
    ? kindsPresent().map(k => ({kind: k, entries: entries.filter(e => kindOf(e.f) === k)}))
    : [{kind: null, entries}];
  const trees = groups.map(g => ({...g, tree: fileTree(g.entries, g.kind || kindFilter())}));
  const hasDirs = trees.some(t => t.tree.kids.some(k => k.kids));
  const k = kindFilter();
  const filter = isSplit() ? `<div class="kind-filter"><div class="seg" role="group" aria-label="Show">` +
    ['all', ...kindsPresent()].map(x => {
      const n = x === 'all' ? view.files.length : view.files.filter(f => kindOf(f) === x).length;
      return `<button data-act="kind" data-kind="${x}" class="${x === k ? 'on' : ''}">${x === 'all' ? 'All' : KIND_LABEL[x]} ${n}</button>`;
    }).join('') + '</div></div>' : '';
  $('#files').innerHTML = (hasDirs ? `<div class="tools">Files<span class="spacer"></span>
      <button class="link" data-act="collapse-all" title="Collapse every folder">Collapse all</button>
      <button class="link" data-act="expand-all" title="Expand every folder">Expand all</button></div>` : '') +
    filter +
    trees.map(t => (t.kind ? `<div class="group">${KIND_LABEL[t.kind]}${linesHtml(sumLines(t.entries.map(e => e.f)))}</div>` : '') +
      treeHtml(t.tree, 0, counts).html).join('');
  markCurrentFile();
}

// Picking a file in the tree opens it, clearing its viewed mark as if you'd unchecked the box, and
// puts its header at the top of the page.
function revealFile(i) {
  const sec = $(`#f${i}`);
  if (!sec) return;
  const f = view.files[i];
  if (isViewed(f)) {
    localStorage.removeItem(key(`viewed:${f.path}`));
    $('[data-act=viewed]', sec).checked = false;
  }
  if (sec.classList.contains('collapsed')) {
    sec.classList.remove('collapsed');
    if (f.additions + f.deletions <= LARGE) fillBody(i);
  }
  renderComments();
  history.replaceState(null, '', `#f${i}`);
  sec.scrollIntoView({block: 'start'});
}

function toggleFiles() {
  const hidden = document.body.classList.toggle('no-files');
  setPref('files', hidden ? '0' : '1');
}

// Highlights the file whose header is at the top of the page, or the collapsed folder hiding it,
// and keeps that row in view in the sidebar.
function markCurrentFile() {
  if (!view) return;
  const sections = $$('#diff > .file:not(.filtered)');
  let cur = sections[0];
  for (const sec of sections) {
    // Just past the scroll-margin-top a tree jump leaves above a file.
    if (sec.getBoundingClientRect().top <= 72) cur = sec; else break;
  }
  $$('#files .current').forEach(el => el.classList.remove('current'));
  if (!cur) return;
  let target = $(`#files a[href="#f${cur.dataset.i}"]`);
  if (!target) return;
  for (let k = target.closest('.kids'); k; k = k.parentElement.closest('.kids')) {
    if (k.previousElementSibling.classList.contains('closed')) target = k.previousElementSibling;
  }
  target.classList.add('current');
  const aside = $('#files'), top = target.offsetTop - aside.offsetTop, bottom = top + target.offsetHeight;
  if (top < aside.scrollTop) aside.scrollTop = top - 8;
  else if (bottom > aside.scrollTop + aside.clientHeight) aside.scrollTop = bottom - aside.clientHeight + 8;
}

// Folders keep the order git lists the files in. A folder whose only child is another folder is
// merged into it ("app/src/main/java/..."), so deep package paths take one row instead of ten.
// `group` keeps a folder's collapsed state separate per tree, since the kinds share roots.
function fileTree(entries, group) {
  const root = {kids: []};
  entries.forEach(({f, i}) => {
    const parts = f.path.split('/');
    let node = root, dir = '';
    for (const part of parts.slice(0, -1)) {
      dir = dir ? `${dir}/${part}` : part;
      let next = node.kids.find(k => k.dir === dir);
      if (!next) { next = {name: part, dir, group, kids: []}; node.kids.push(next); }
      node = next;
    }
    node.kids.push({name: parts[parts.length - 1], file: f, i});
  });
  const compact = node => {
    for (const k of node.kids) if (k.kids) {
      while (k.kids.length === 1 && k.kids[0].kids) {
        const only = k.kids[0];
        k.name = `${k.name}/${only.name}`; k.dir = only.dir; k.kids = only.kids;
      }
      compact(k);
    }
    return node;
  };
  return compact(root);
}

// Returns the rows plus roll-ups a folder shows about its contents: the open-comment count (so a
// closed folder still tells you something needs you) and whether every file in it is viewed.
function treeHtml(node, depth, counts) {
  let html = '', cnt = 0, viewed = true;
  const pad = `style="padding-left:${8 + depth * 14}px"`;
  for (const k of node.kids) {
    if (k.kids) {
      const sub = treeHtml(k, depth + 1, counts);
      const id = `${k.group}:${k.dir}`;
      const closed = pref(`dir:${id}`, '') === '1';
      html += `<div class="dir${closed ? ' closed' : ''}${sub.viewed ? ' viewed' : ''}" data-act="toggle-dir" data-dir="${esc(id)}" ${pad} title="${esc(k.dir)}">
        <span class="caret">▾</span><span class="name">&lrm;${esc(k.name)}&lrm;</span>
        ${closed && sub.cnt ? `<span class="cnt">${sub.cnt}</span>` : ''}</div><div class="kids">${sub.html}</div>`;
      cnt += sub.cnt; viewed = viewed && sub.viewed;
    } else {
      const f = k.file, n = counts[f.path] || 0, v = isViewed(f);
      html += `<a href="#f${k.i}" class="${v ? 'viewed' : ''}" ${pad} title="${esc(f.path)}">
        <span class="st ${f.status}">${f.status[0].toUpperCase()}</span><span class="name">${esc(k.name)}</span>
        ${n ? `<span class="cnt">${n}</span>` : ''}</a>`;
      cnt += n; viewed = viewed && v;
    }
  }
  return {html, cnt, viewed};
}

// -------------------------------------------------------------------------------------- comments

// The stack branch being reviewed, or null outside the stack view.
function reviewBranch() { return view && view.mode === 'stack' ? view.branch : null; }

// Comments belong to the branch they were left on. Outside the stack view, stack comments only
// show on the checked-out branch, since that is the code the other views diff.
function visible(c) {
  const b = reviewBranch() ?? meta.branch;
  return !c.branch || c.branch === b;
}

function renderComments() {
  $$('.thread').forEach(t => t.remove());
  $$('tr.thread-row').forEach(r => { if (!r.querySelector('.cform')) r.remove(); });
  const fileIdx = {}, oldIdx = {};
  view.files.forEach((f, i) => { if (f.new_path) fileIdx[f.new_path] = i; if (f.old_path) oldIdx[f.old_path] = i; });
  let other = 0;
  const shown = comments.filter(visible);
  const general = shown.filter(c => !c.file);
  for (const c of general) $('#general-threads').appendChild(threadEl(c, false));
  for (const c of shown.filter(c => c.file)) {
    const i = c.side === 'old' ? (c.old_rev === view.old_rev ? oldIdx[c.file] : undefined) : fileIdx[c.file];
    if (i === undefined) { $('#other-threads').appendChild(threadEl(c, true)); other++; continue; }
    const body = $(`#f${i} .rows`);
    const row = !c.outdated && c.current_line &&
      body.querySelector(c.side === 'old' ? `tr.ln[data-o="${c.current_line}"]` : `tr.ln[data-n="${c.current_line}"]`);
    if (row) threadContainer(row).insertBefore(threadEl(c, false), threadContainer(row).querySelector('.cform'));
    else $(`#f${i} .outside`).appendChild(threadEl(c, true));
  }
  $('#other').hidden = !other;
  const drafts = comments.filter(c => c.status === 'draft').length;
  const open = comments.filter(c => c.status === 'open').length;
  const waiting = comments.filter(c => ['replied', 'addressed'].includes(c.status)).length;
  $('#counts').textContent = [drafts && `${drafts} draft`, open && `${open} open`, waiting && `${waiting} awaiting you`]
    .filter(Boolean).join(' · ');
  $('#submit').textContent = drafts ? `Submit review (${drafts})` : 'Submit review';
  $('#mode option[value=since]').disabled = !reviews.length;
  renderFileList();
  paintSelections();
}

function threadContainer(row) {
  let next = row.nextElementSibling;
  if (!next || !next.classList.contains('thread-row')) {
    next = document.createElement('tr');
    next.className = 'thread-row';
    next.innerHTML = `<td colspan="${row.closest('table').dataset.cols || 3}"></td>`;
    row.after(next);
  }
  return next.firstElementChild;
}

// "12" or "10–12" for a range.
function linesLabel(start, end) { return start && start < end ? `${start}–${end}` : `${end}`; }

function locLabel(c) {
  if (!c.file) return '';
  const span = c.anchor.span || 1;
  if (c.outdated) return `${c.file} · originally line${span > 1 ? 's' : ''} ${linesLabel(c.anchor.line - span + 1, c.anchor.line)}`;
  return `${c.file}:${linesLabel(c.current_start, c.current_line)}${c.side === 'old' ? ' (old)' : ''}`;
}

function threadEl(c, showLoc) {
  const el = document.createElement('div');
  const folded = (c.status === 'resolved' || c.status === 'addressed' && c.outdated) && !unfolded.has(c.id);
  el.className = `thread st-${c.status}${folded ? ' folded' : ''}`;
  el.dataset.id = c.id;
  const actions = c.status === 'draft'
    ? `<button class="link" data-act="edit">Edit</button><button class="link" data-act="delete">Delete</button>`
    : c.status === 'resolved' ? `<button class="link" data-act="reopen">Reopen</button>`
    : `<button class="link" data-act="resolve">Resolve</button>`;
  const msgs = [{author: c.author, body: c.body, at: c.submitted_at || c.created_at}, ...c.replies];
  const a = c.anchor;
  const ctx = c.file && (showLoc || c.outdated) && a
    ? `<pre class="ctx">${esc([...(a.range_text ? a.range_text.slice(0, -1) : a.before), a.line_text, ...a.after].join('\n'))}</pre>` : '';
  // Inline threads sit under the last line, so say when they cover more than that one.
  const ranged = !showLoc && !c.outdated && c.current_start && c.current_start < c.current_line
    ? `Lines ${linesLabel(c.current_start, c.current_line)}` : '';
  el.innerHTML = `
    <div class="thead">
      <button class="link" data-act="fold" title="Fold">${folded ? '▸' : '▾'}</button>
      <span class="badge ${c.status}">${c.status === 'replied' ? 'agent replied' : c.status}</span>
      ${c.outdated ? '<span class="badge outdated">outdated</span>' : ''}
      <span class="loc">${showLoc || c.outdated ? esc(locLabel(c)) : ranged}${folded ? ` ${esc(c.body.slice(0, 80))}` : ''}</span>
      <span class="id">${c.id}</span>${actions}
    </div>
    <div class="tbody">
      ${ctx ? `<div class="msg">${ctx}</div>` : ''}
      ${msgs.map(m => `<div class="msg ${m.author === 'reviewer' ? '' : 'agent'}">
        <span class="who">${m.author === 'reviewer' ? 'You' : esc(m.author)}</span><span class="when">${when(m.at)}</span>
        <div class="body">${md(m.body)}</div></div>`).join('')}
      ${c.status === 'draft' ? '' : `<div class="reply"><textarea placeholder="Reply…  (⌘↩ to send; replying reopens the thread for the agent)"></textarea>
        <div class="btns"><button class="primary" data-act="reply">Reply</button></div></div>`}
    </div>`;
  return el;
}

function openForm(container, target) {
  const existing = container.querySelector('.cform');
  if (existing) { existing.querySelector('textarea').focus(); return; }
  const form = document.createElement('div');
  form.className = 'cform';
  const range = target.start_line ? `<div class="hint">Lines ${target.start_line}–${target.line}${target.side === 'old' ? ' (old)' : ''}</div>` : '';
  form.innerHTML = `${range}<textarea placeholder="Leave a comment for the agent…"></textarea>
    <div class="btns"><span class="hint">Saved as a draft until you submit the review · ⌘↩ to add</span>
    <span class="err"></span><button data-act="cancel-form">Cancel</button>
    <button class="primary" data-act="save-form">Add review comment</button></div>`;
  form.target = target;
  container.appendChild(form);
  form.querySelector('textarea').focus();
}

function closeForm(form) {
  const row = form.closest('tr.thread-row');
  form.remove();
  if (row && !row.querySelector('.thread')) row.remove();
  paintSelections();
}

// ---------------------------------------------------------------------------- multi-line ranges

// Drag from one line's + to another, or click a + and then shift-click another, to comment on the
// lines between them. A range stays on the side (old or new) it started on, like GitHub.
let drag = null, lastLine = null;

// A row's line number on one side, or 0 when the row has no line there (an add row on the old side).
function lineOn(row, side) { return +(side === 'old' ? row.dataset.o : row.dataset.n) || 0; }

function rangeRows(i, side, start, end) {
  return $$(`#f${i} tr.ln`).filter(r => { const n = lineOn(r, side); return n >= start && n <= end; });
}

function paintRange(i, side, start, end) {
  rangeRows(i, side, start, end).forEach(r => r.classList.add('sel'));
}

// Forms keep their range lit until they close, so you can see what the comment is about.
function paintSelections() {
  $$('tr.ln.sel').forEach(r => r.classList.remove('sel'));
  for (const form of $$('#diff .cform')) {
    const t = form.target, sec = form.closest('.file');
    if (t && t.start_line && sec) paintRange(+sec.dataset.i, t.side, t.start_line, t.line);
  }
  if (drag) paintRange(drag.i, drag.side, Math.min(drag.start, drag.end), Math.max(drag.start, drag.end));
}

function onLineMouseDown(e) {
  const btn = e.target.closest('.addc');
  if (!btn || e.button !== 0) return;
  e.preventDefault();
  const row = btn.closest('tr'), sec = row.closest('.file');
  const i = +sec.dataset.i, side = btn.dataset.side || row.dataset.side, line = lineOn(row, side);
  const extend = e.shiftKey && lastLine && lastLine.i === i && lastLine.side === side;
  drag = {i, side, start: extend ? lastLine.line : line, end: line};
  document.body.classList.add('dragging');
  paintSelections();
}

function onLineMouseOver(e) {
  if (!drag) return;
  const row = e.target.closest('tr.ln');
  if (!row || +row.closest('.file').dataset.i !== drag.i) return;
  const n = lineOn(row, drag.side);
  if (n && n !== drag.end) { drag.end = n; paintSelections(); }
}

function onLineMouseUp() {
  if (!drag) return;
  const {i, side, start, end} = drag;
  drag = null;
  document.body.classList.remove('dragging');
  openLineForm(i, side, Math.min(start, end), Math.max(start, end));
}

// The form (and later the thread) sits under the range's last line, where the comment anchors.
function openLineForm(i, side, start, end) {
  const f = view.files[i];
  const row = rangeRows(i, side, end, end).find(r => r.dataset.side === side) || rangeRows(i, side, end, end)[0];
  if (!row) return;
  // Re-picking a range replaces a form that hasn't been typed in yet, so shift-click can extend it.
  for (const form of $$(`#f${i} .cform`)) if (!form.querySelector('textarea').value.trim()) closeForm(form);
  lastLine = {i, side, line: end};
  openForm(threadContainer(row), {file: side === 'old' ? f.old_path : f.new_path, side, line: end,
    ...(start < end ? {start_line: start} : {}), old_rev: view.old_rev});
  paintSelections();
}

// Hovering a range comment lights up the lines it covers.
function onThreadHover(e) {
  if (drag) return;
  const thread = e.target.closest('tr.thread-row .thread');
  const c = thread && comments.find(c => c.id === thread.dataset.id);
  const key = c && c.current_start && c.current_start < c.current_line ? c.id : null;
  if (key === onThreadHover.shown) return;
  onThreadHover.shown = key;
  paintSelections();
  if (key) paintRange(+thread.closest('.file').dataset.i, c.side, c.current_start, c.current_line);
}

async function onClick(e) {
  const link = e.target.closest('#files a[href^="#f"]');
  if (link && !e.metaKey && !e.ctrlKey && !e.shiftKey) { e.preventDefault(); revealFile(+link.getAttribute('href').slice(2)); return; }
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  const thread = btn.closest('.thread');
  const id = thread && thread.dataset.id;
  const file = btn.closest('.file');
  const f = file && view.files[+file.dataset.i];
  try {
    if (act === 'kind') {
      setPref('kind', btn.dataset.kind);
      applyKindFilter();
      window.scrollTo({top: 0});
    } else if (act === 'collapse-all' || act === 'expand-all') {
      for (const d of $$('#files .dir')) {
        if (act === 'collapse-all') setPref(`dir:${d.dataset.dir}`, '1'); else localStorage.removeItem(key(`dir:${d.dataset.dir}`));
      }
      renderFileList();
    } else if (act === 'toggle-dir') {
      const dir = `dir:${btn.dataset.dir}`;
      if (btn.classList.contains('closed')) localStorage.removeItem(key(dir)); else setPref(dir, '1');
      renderFileList();
    } else if (act === 'toggle-ws') {
      wsOverride.set(f.path, !ignoresWs(f));
      await refetchFile(+file.dataset.i);
    } else if (act === 'line-comment') {
      // A mouse press already opened the form (see onLineMouseUp); this path is for the keyboard.
      if (e.detail) return;
      const row = btn.closest('tr'), side = btn.dataset.side || row.dataset.side, line = lineOn(row, side);
      openLineForm(+file.dataset.i, side, line, line);
    } else if (act === 'file-comment') {
      // File-level comments anchor to line 1 of the new file.
      file.classList.remove('collapsed');
      openForm($('.outside', file), {file: f.new_path, side: 'new', line: 1});
    } else if (act === 'save-form') {
      const form = btn.closest('.cform');
      const body = form.querySelector('textarea').value;
      if (!body.trim()) return;
      await api('/api/comments', {...form.target, body, branch: reviewBranch()});
      closeForm(form);
      await loadComments();
    } else if (act === 'cancel-form') {
      closeForm(btn.closest('.cform'));
    } else if (act === 'reply') {
      const ta = thread.querySelector('.reply textarea');
      if (!ta.value.trim()) return;
      await api(`/api/comments/${id}/reply`, {body: ta.value});
      ta.value = '';
      await loadComments();
    } else if (act === 'resolve' || act === 'reopen') {
      await api(`/api/comments/${id}/status`, {status: act === 'resolve' ? 'resolved' : 'open'});
      unfolded.delete(id);
      await loadComments();
    } else if (act === 'delete') {
      if (!confirm('Delete this draft comment?')) return;
      await api(`/api/comments/${id}/delete`, {});
      await loadComments();
    } else if (act === 'edit') {
      const c = comments.find(c => c.id === id);
      const body = thread.querySelector('.msg:last-child .body');
      body.innerHTML = `<textarea>${esc(c.body)}</textarea><div class="btns"><button data-act="cancel-edit">Cancel</button>
        <button class="primary" data-act="save-edit">Save</button></div>`;
      body.querySelector('textarea').focus();
    } else if (act === 'save-edit') {
      await api(`/api/comments/${id}/edit`, {body: thread.querySelector('textarea').value});
      await loadComments();
    } else if (act === 'cancel-edit') {
      renderComments();
    } else if (act === 'fold') {
      if (thread.classList.contains('folded')) unfolded.add(id); else unfolded.delete(id);
      thread.replaceWith(threadEl(comments.find(c => c.id === id), !thread.closest('tr.thread-row')));
    } else if (act === 'toggle-file') {
      file.classList.toggle('collapsed');
      if (!file.classList.contains('collapsed')) { fillBody(+file.dataset.i); renderComments(); }
    } else if (act === 'load-file') {
      fillBody(+file.dataset.i);
      renderComments();
    } else if (act === 'viewed') {
      if (btn.checked) { setPref(`viewed:${f.path}`, f.hash); file.classList.add('collapsed'); }
      else { localStorage.removeItem(key(`viewed:${f.path}`)); file.classList.remove('collapsed'); fillBody(+file.dataset.i); renderComments(); }
      renderFileList();
    }
  } catch (err) {
    const target = btn.closest('.cform, .thread');
    const errEl = target && target.querySelector('.err');
    if (errEl) errEl.textContent = err.message; else alert(err.message);
  }
}

function openSubmit() {
  const drafts = comments.filter(c => c.status === 'draft').length;
  $('#submit-info').textContent = drafts
    ? `${drafts} draft comment${drafts === 1 ? '' : 's'} will be sent to the agent.`
    : 'No draft comments. You can still send an overall summary.';
  $('#submit-err').textContent = '';
  $('#submit-dlg').showModal();
  $('#summary').focus();
}

async function doSubmit() {
  try {
    await api('/api/submit', {summary: $('#summary').value});
    $('#summary').value = '';
    $('#submit-dlg').close();
    await loadComments();
    showBanner('Review submitted. Ask your agent to run /address-review.');
  } catch (e) {
    $('#submit-err').textContent = e.message;
  }
}

init().catch(e => { $('#loading').innerHTML = `<span class="err">${esc(e.message)}</span>`; });
</script>
</body>
</html>
